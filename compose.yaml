# Local stack (Manual Phase Four). Only the frontend runs today; the FastAPI service and PostgreSQL
# are owned by the backend/DevOps team and are left commented until apps/api has code.
services:
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_USE_MOCKS: "true"   # set to "false" once the api service below is running
    ports:
      - "8080:80"
    restart: unless-stopped

