server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Forward API calls to the FastAPI service when it exists (compose service name "api").
  location /api/ {
    # Resolve at request time so nginx still starts while the api service doesn't exist yet.
    resolver 127.0.0.11 valid=30s;
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Single-page app: every other path serves index.html
  location / {
    try_files $uri /index.html;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
  }
}
